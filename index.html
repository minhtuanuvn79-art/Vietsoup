<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>226 POS - Hệ thống bán hàng</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="pos-header">
        <div class="logo">
            <i class="fa-solid fa-store"></i> 226 POS
        </div>
        
        <div class="branch-info" style="color: #00cec9; font-weight: bold; font-size: 1.1rem;">
            <i class="fa-solid fa-location-dot"></i> <span id="current-branch-name">Đang tải...</span>
        </div>

<div class="user-info-container">
            <div class="user-profile">
                <i class="fa-solid fa-circle-user"></i> <span id="current-username">Thu ngân</span>
            </div>
            
            <div class="dropdown-menu-wrapper">
                <button class="hamburger-btn" onclick="toggleUserMenu()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="dropdown-content" id="user-dropdown">
                    <a href="manager.html"><i class="fa-solid fa-chart-pie" style="color: #0984e3;"></i> Quản lý cửa hàng</a>
                    <a href="admin.html"><i class="fa-solid fa-gears" style="color: #00cec9;"></i> Hệ thống tổng</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" onclick="logout()" style="color: #d63031;"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <div class="pos-container">
<main class="menu-area">
            <div class="search-bar-container">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="product-search" placeholder="Tìm kiếm món ăn (VD: sua dau, tra chanh...)" oninput="handleSearch(event)">
                </div>
            </div>

            <div class="categories" id="category-list">
                <button class="active">Tất cả</button>
                <button>Đồ ăn</button>
                <button>Thức uống</button>
                <button>Topping</button>
            </div>
            
            <div class="product-grid" id="product-grid">
                </div>
        </main>

        <aside class="order-area">
            <div class="order-header">
                <h2>Đơn hàng hiện tại</h2>
                <span class="order-type">
                    <i class="fa-solid fa-utensils"></i> Tại bàn
                </span>
            </div>
            
            <div class="order-items" id="order-items">
                </div>
            
            <div class="order-summary">
                <div class="summary-row">
                    <span>Số lượng:</span>
                    <span id="total-qty">0</span>
                </div>
                <div class="summary-row">
                    <span>Tạm tính:</span>
                    <span id="sub-total">0đ</span>
                </div>
                <div class="summary-row total-row">
                    <span>Khách cần trả:</span>
                    <span id="total-price">0đ</span>
                </div>
            </div>
            
            <div class="order-actions">
                <button class="btn-cancel" onclick="clearOrder()">
                    <i class="fa-solid fa-trash"></i> Hủy
                </button>
                <button class="btn-pay" onclick="checkout()">
                    <i class="fa-solid fa-money-bill-wave"></i> Thanh toán (F9)
                </button>
            </div>
        </aside>
    </div>
<div id="product-options-modal" class="mobile-modal-overlay" onclick="closeMobileModal('product-options-modal')">
        <div class="mobile-modal-sheet" onclick="event.stopPropagation()">
            <div class="mobile-modal-handle"></div>
            
            <div class="mobile-modal-header">
                <h3 style="flex: 1;"><i class="fa-solid fa-sliders"></i> Tùy chỉnh: <span id="mobile-modal-product-name" style="color: #0984e3;"></span></h3>
                <button class="mobile-close-btn" onclick="closeMobileModal('product-options-modal')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="mobile-modal-body">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Lượng đường</label>
                    <select id="option-sugar" style="width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 1rem; outline: none; background: #f8f9fa;">
                        <option value="100%">100% Đường</option>
                        <option value="70%">70% Đường</option>
                        <option value="50%">50% Đường</option>
                        <option value="0%">Không Đường</option>
                    </select>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Lượng đá</label>
                    <select id="option-ice" style="width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 1rem; outline: none; background: #f8f9fa;">
                        <option value="100%">100% Đá</option>
                        <option value="50%">50% Đá</option>
                        <option value="0%">Không Đá (Nóng)</option>
                    </select>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Topping thêm</label>
                    <select id="option-topping" style="width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 1rem; outline: none; background: #f8f9fa;">
                        <option value="Không">Không thêm</option>
                        <option value="Trân châu đen">Trân châu đen (+5.000đ)</option>
                        <option value="Thạch trái cây">Thạch trái cây (+5.000đ)</option>
                        <option value="Pudding trứng">Pudding trứng (+5.000đ)</option>
                    </select>
                </div>

                <button onclick="confirmAddCustomizedProduct()" style="width: 100%; padding: 15px; background: #00b894; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                    <i class="fa-solid fa-cart-plus"></i> Xác nhận thêm vào đơn
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
